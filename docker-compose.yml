services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rpsbattle
      POSTGRES_USER: rps_user
      POSTGRES_PASSWORD: rps_password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rps_user -d rpsbattle"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/rpsbattle
      DB_USER: rps_user
      DB_PASSWORD: rps_password
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres-data:
